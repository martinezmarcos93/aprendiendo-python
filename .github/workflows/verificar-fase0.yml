name: Verificación base y barridos

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - audit/ux-v1-2026-09-30
      - sweep/consolidacion-ux-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Compilar módulos Python
        run: python -m compileall -q tortuscript web herramientas
      - name: Tests Python y JavaScript
        run: python -m unittest discover -s tests
      - name: Validador de contenido
        if: always()
        run: python herramientas/validar_contenido.py
