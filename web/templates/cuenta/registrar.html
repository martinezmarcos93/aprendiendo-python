<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · TortuScript</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/tortuscript.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tortu.css') }}">
</head>
<body>
<main id="contenido" class="columna-ancha pagina-error">
  <section class="tarjeta">
    <div class="centrado">
      <div class="mascota gran" aria-hidden="true">🐢</div>
      <h1>Crear cuenta adulta</h1>
      <p class="texto-grande">La cuenta adulta administra los perfiles educativos de la familia.</p>
    </div>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('cuenta.registrar_post') }}">
      <label class="etiqueta" for="email">Correo</label>
      <input class="campo" id="email" name="email" type="email" autocomplete="email" required>
      <label class="etiqueta" for="password">Contraseña</label>
      <input class="campo" id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
      <p class="tenue">La contraseña debe tener al menos 12 caracteres.</p>
      <p><button class="boton verde grande" type="submit">Crear cuenta</button></p>
    </form>
    <p class="centrado"><a href="{{ url_for('cuenta.ingresar') }}">Ya tengo una cuenta</a></p>
  </section>
</main>
</body>
</html>
