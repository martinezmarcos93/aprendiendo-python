<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elegí un perfil · TortuScript</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tortu.css') }}">
</head>
<body>
<main id="contenido" class="columna-ancha pagina-error">
  <section class="tarjeta">
    <div class="centrado">
      <div class="mascota gran" aria-hidden="true">🐢</div>
      <h1>¿Quién programa hoy?</h1>
      <p class="texto-grande">Elegí un perfil educativo.</p>
    </div>
    <div id="error" class="error" role="alert" hidden></div>
    <div class="lista-perfiles">
      {% for perfil in perfiles %}
      <button class="boton grande" type="button" data-perfil="{{ perfil.id }}">{{ perfil.display_name }}</button>
      {% else %}
      <p class="centrado">Todavía no hay perfiles. Creá el primero abajo.</p>
      {% endfor %}
    </div>
    {% if perfiles|length < 5 %}
    <hr>
    <form id="nuevo-perfil">
      <label class="etiqueta" for="nombre">Nuevo perfil</label>
      <input class="campo" id="nombre" name="nombre" maxlength="40" autocomplete="off" required>
      <button class="boton violeta grande" type="submit">Crear perfil y entrar</button>
    </form>
    {% endif %}
    <p class="centrado"><a href="{{ url_for('cuenta.logout') }}">Cerrar sesión</a></p>
  </section>
</main>
<script>
(function () {
  const csrf = {{ csrf|tojson }};
  const error = document.getElementById("error");
  function mostrarError(texto) {
    error.textContent = texto;
    error.hidden = false;
  }
  async function seleccionar(id) {
    const r = await fetch("{{ url_for('cuenta.seleccionar_perfil') }}", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-Tortu-CSRF": csrf},
      body: JSON.stringify({perfil_id: id})
    });
    if (r.ok) location.href = {{ request.args.get("next", "/")|tojson }};
    else {
      const d = await r.json().catch(() => ({}));
      mostrarError(d.mensaje || "No se pudo seleccionar el perfil.");
    }
  }
  document.querySelectorAll("[data-perfil]").forEach(btn => btn.addEventListener("click", () => seleccionar(btn.dataset.perfil)));
  const form = document.getElementById("nuevo-perfil");
  if (form) form.addEventListener("submit", async e => {
    e.preventDefault();
    const r = await fetch("{{ url_for('cuenta.crear_perfil') }}", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-Tortu-CSRF": csrf},
      body: JSON.stringify({nombre: document.getElementById("nombre").value})
    });
    if (r.ok) seleccionar((await r.json()).perfil.id);
    else {
      const d = await r.json().catch(() => ({}));
      mostrarError(d.mensaje || "No se pudo crear el perfil.");
    }
  });
})();
</script>
</body>
</html>
